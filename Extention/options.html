<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Настройки Review Assistant</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      width: 360px;
    }
    h3 {
      margin-top: 0;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      color: #333;
    }
    .hint {
      font-size: 11px;
      color: #888;
      margin-bottom: 10px;
    }
    input {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 13px;
    }
    button {
      margin-top: 12px;
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }
    #saveBtn {
      background: #4caf50;
      color: #fff;
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      min-height: 16px;
    }
    #status.ok { color: #2e7d32; }
    #status.err { color: #c62828; }
  </style>
</head>
<body>
  <h3>Настройки Review Assistant</h3>

  <label for="serverUrl">Адрес локального сервера GigaChatReplyServer</label>
  <div class="hint">
    Сервер должен быть запущен (иконка в трее). Обычно менять адрес не нужно —
    оставьте значение по умолчанию, если не меняли порт вручную в самом сервере.
  </div>
  <input type="text" id="serverUrl" placeholder="http://localhost:5005">

  <button id="saveBtn">Сохранить</button>

  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
